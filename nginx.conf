server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Docker health check
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vue Router: history mode
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Не кешируем HTML, чтобы пользователи получали
    # актуальные ссылки на собранные JS/CSS-файлы.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Кешируем ресурсы, если используемый Vue CLI
    # действительно создаёт файлы с хешами в именах.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Скрытые файлы не должны раздаваться посетителям.
    location ~ /\. {
        deny all;
    }
}