name: Vue 3 CI/CD

on:
  push:
    branches:
      - master_teleport

  pull_request:
    branches:
      - master_teleport

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-app-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build Vue application
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vue-build
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish-and-deploy:
    name: Publish Docker image and deploy
    runs-on: ubuntu-latest

    needs:
      - ci

    # Pull requests must never receive production secrets.
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write

    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.name }}:latest
            ghcr.io/${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" \
            > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

          echo "Checking SSH private key..."
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          echo "Private key format is valid."

      - name: Deploy to VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE: ghcr.io/${{ steps.image.outputs.name }}:${{ github.sha }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${VPS_USER}@${VPS_HOST}" \
            "IMAGE='${IMAGE}' bash -s" <<'REMOTE'
          set -euo pipefail

          cd /opt/client-app

          export IMAGE

          docker compose pull
          docker compose up -d --remove-orphans

          for attempt in $(seq 1 30); do
            if docker inspect \
              --format='{{.State.Health.Status}}' \
              client-app 2>/dev/null | grep -qx healthy; then
              echo "Deployment successful"
              exit 0
            fi

            sleep 2
          done

          echo "Health check failed"

          docker compose ps
          docker compose logs --tail=100 client-app

          exit 1
          REMOTE
